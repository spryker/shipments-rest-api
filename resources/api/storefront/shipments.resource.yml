resource:
    name: Shipments
    shortName: shipments
    description: 'Shipment groups exposed as a relationship target for `checkout-data`. Populated through `Spryker\Glue\CheckoutRestApi\Api\Storefront\Relationship\CheckoutDataShipmentsRelationshipResolver`; not addressable as a standalone endpoint.'

    includes:
        - relationshipName: shipment-methods
          targetResource: ShipmentMethods
          resolverClass: Spryker\Glue\ShipmentsRestApi\Api\Storefront\Relationship\ShipmentMethodsByShipmentRelationshipResolver

    properties:
        shipmentsId:
            type: string
            identifier: true
            readable: true
            writable: false
            description: 'Shipment group identifier.'
            openapiContext:
                example: '5'

        items:
            type: array
            readable: true
            writable: false
            description: 'Item group keys belonging to this shipment group.'
            openapiContext:
                example:
                    - 'c4ca4238a0b923820dcc509a6f75849b'

        selectedShipmentMethod:
            type: object
            objectName: ShipmentMethod
            readable: true
            writable: false
            description: 'Selected shipment method for this shipment group.'
            properties:
                id:
                    type: integer
                    description: 'Shipment method identifier.'
                    openapiContext:
                        example: 1
                name:
                    type: string
                    description: 'Shipment method name.'
                    openapiContext:
                        example: 'Standard'
                carrierName:
                    type: string
                    description: 'Carrier name.'
                    openapiContext:
                        example: 'Spryker Dummy Shipment'
                price:
                    type: integer
                    description: 'Shipment price.'
                    openapiContext:
                        example: 490
                taxRate:
                    type: number
                    description: 'Tax rate.'
                    openapiContext:
                        example: 19
                shipmentType:
                    type: string
                    description: 'Shipment type.'
                    openapiContext:
                        example: 'delivery'
                currencyIsoCode:
                    type: string
                    description: 'Currency ISO code.'
                    openapiContext:
                        example: 'EUR'

        shippingAddress:
            type: object
            objectName: Address
            nullable: true
            readable: true
            writable: false
            description: 'Shipping address used for this shipment group.'
            properties:
                salutation:
                    type: string
                    nullable: true
                    description: 'Address salutation.'
                    openapiContext:
                        example: 'Mr'
                firstName:
                    type: string
                    nullable: true
                    description: 'Address first name.'
                    openapiContext:
                        example: 'John'
                middleName:
                    type: string
                    nullable: true
                    description: 'Address middle name.'
                    openapiContext:
                        example: null
                lastName:
                    type: string
                    nullable: true
                    description: 'Address last name.'
                    openapiContext:
                        example: 'Doe'
                address1:
                    type: string
                    nullable: true
                    description: 'Street name.'
                    openapiContext:
                        example: 'Main Street'
                address2:
                    type: string
                    nullable: true
                    description: 'House number.'
                    openapiContext:
                        example: '1'
                address3:
                    type: string
                    nullable: true
                    description: 'Additional address line.'
                    openapiContext:
                        example: null
                zipCode:
                    type: string
                    nullable: true
                    description: 'ZIP code.'
                    openapiContext:
                        example: '10115'
                city:
                    type: string
                    nullable: true
                    description: 'City.'
                    openapiContext:
                        example: 'Berlin'
                iso2Code:
                    type: string
                    nullable: true
                    description: 'ISO 2 country code.'
                    openapiContext:
                        example: 'DE'
                phone:
                    type: string
                    nullable: true
                    description: 'Phone number.'
                    openapiContext:
                        example: '+49 30 123456'
                company:
                    type: string
                    nullable: true
                    description: 'Company name.'
                    openapiContext:
                        example: 'Spryker Systems GmbH'
                country:
                    type: string
                    nullable: true
                    description: 'Country name.'
                    openapiContext:
                        example: 'Germany'
                poBox:
                    type: string
                    nullable: true
                    description: 'PO box.'
                    openapiContext:
                        example: null
                cellPhone:
                    type: string
                    nullable: true
                    description: 'Cell phone number.'
                    openapiContext:
                        example: null
                description:
                    type: string
                    nullable: true
                    description: 'Address description.'
                    openapiContext:
                        example: null
                comment:
                    type: string
                    nullable: true
                    description: 'Address comment.'
                    openapiContext:
                        example: null
                email:
                    type: string
                    nullable: true
                    description: 'Email address.'
                    openapiContext:
                        example: null
                idCompanyBusinessUnitAddress:
                    type: string
                    nullable: true
                    description: 'Company business unit address identifier this address was mapped from.'
                    openapiContext:
                        example: '1a2b3c'

        requestedDeliveryDate:
            type: string
            nullable: true
            readable: true
            writable: false
            description: 'Requested delivery date for this shipment group.'
            openapiContext:
                example: '2026-05-20'

        context:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Internal shipment group context (serialized `ShipmentGroupTransfer`); consumed by `ShipmentMethodsByShipmentRelationshipResolver`. Not serialized.'
            openapiContext:
                example:
                    shipment:
                        method:
                            idShipmentMethod: 5
                            name: 'Standard'
                    availableShipmentMethods:
                        methods:
                            - idShipmentMethod: 5
                              name: 'Standard'
                              carrierName: 'Spryker Dummy Shipment'
                              storeCurrencyPrice: 490
                              taxRate: 19
                              deliveryTime: 3
                              currencyIsoCode: 'EUR'
